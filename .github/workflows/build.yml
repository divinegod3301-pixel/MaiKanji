name: MaiKanji APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract MaiKanji ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="MAIKANJI_JAPANESE_UI_WIDGET_SRS_SOUND_FIX_BUILDABLE.zip"

          echo "Checking ZIP..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found:"
            echo "$ZIP_FILE"
            echo ""
            echo "Files in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "======================================"
          echo "ZIP EXTRACTED SUCCESSFULLY"
          echo "======================================"

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No Gradle settings file found."
            find extracted -maxdepth 7 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            find "$PROJECT_DIR" -maxdepth 3 -type d | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build MaiKanji Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING MAIKANJI"
          echo "======================================"

          echo "Project:"
          pwd

          echo ""
          echo "Starting Gradle..."

          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Verify APK exists
        shell: bash
        run: |
          set -e

          APK_DIR="${PROJECT_DIR}/app/build/outputs/apk/debug"

          echo "Checking APK output..."

          APK=$(find "$APK_DIR" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

      - name: Upload MaiKanji APK
        uses: actions/upload-artifact@v4
        with:
          name: MaiKanji-${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
